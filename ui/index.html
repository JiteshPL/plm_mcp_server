<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D PLM Viewer - AI Copilot Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
  <div class="app-container">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="status-indicator"></div>
          <h2>PLM AI Copilot</h2>
        </div>
        <!-- <span class="subtitle">Natural Language & One-Click Control</span> -->
      </div>

<div id="agent-status" class="agent-status hidden">

    <div class="agent-status-header">

        <div class="agent-title">
            <span class="agent-icon">🤖</span>
            <span>PLM Copilot</span>
        </div>

        <div class="agent-status-right">

            <span id="agent-status-state">
                Working...
            </span>

            <button
                id="agent-status-close"
                type="button"
                onclick="closeAgentStatus()"
                title="Close agent activity">
                ×
            </button>

        </div>

    </div>

    <div id="agent-steps"></div>

</div>


      <div id="chat-messages">

        <div class="message assistant welcome-message">
          <strong>PLM AI Copilot</strong>
          <span>Ask me to inspect, find, isolate, or modify the 3D assembly.</span>
        </div>

      </div>

      <div class="chat-input-container">
        <input type="text" id="user-input" placeholder="Ask PLM Copilot..."
          onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
      <button id="clear-chat-btn" onclick="clearChatWindow()">Clear Chat</button>
    </aside>

    <main id="canvas-container">
      <div id="log-output">Loading CAD Model...</div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script src="chat-ui.js"></script>
</body>

</html>
