<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Realistic CAD Viewer - MCP</title>
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <h2>Realistic CAD Viewer - MCP Control</h2>
    <p style="font-size: 0.8rem; color: #ccc;">Connected on ws://localhost:8080</p>

    <button class="btn btn-reset" onclick="resetScene()">Reset View & Scene</button>
    <div id="log-output">Loading Realistic Model...</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
