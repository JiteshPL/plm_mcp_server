<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D CAD Viewer - AI Copilot Dashboard</title>
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- LEFT SIDEBAR: BOT & OPTIONS -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="status-indicator"></div>
          <h2>CAD AI Copilot</h2>
        </div>
        <span class="subtitle">Natural Language & One-Click Control</span>
      </div>

      <!-- Quick Option Action Chips -->
      <div class="preset-section">
        <span class="section-title">QUICK OPTIONS</span>
        <div class="options-grid">
          <button class="chip-btn" onclick="sendQuickAction('Explode assembly by 1.2')">💥 Explode View</button>
          <button class="chip-btn" onclick="sendQuickAction('Highlight Vendor-A components in blue')">🔵 Vendor-A (Tyres)</button>
          <button class="chip-btn" onclick="sendQuickAction('Highlight Vendor-B components in red')">🔴 Vendor-B (Body)</button>
          <button class="chip-btn" onclick="sendQuickAction('Set view to Top')">📐 Top View</button>
          <button class="chip-btn" onclick="sendQuickAction('Set view to Isometric')">🎲 Isometric View</button>
          <button class="chip-btn" onclick="sendQuickAction('Create ZX cross section')">✂️ Cross Section</button>
          <button class="chip-btn btn-reset-chip" onclick="triggerReset()">🔄 Reset All</button>
        </div>
      </div>

      <!-- Chat History -->
      <div id="chat-messages">
        <div class="message assistant">
          Hello! I am your 3D CAD Copilot. Type a command or click any quick option above to interact with the model.
        </div>
      </div>

      <!-- Input Bar -->
      <div class="chat-input-container">
        <input type="text" id="user-input" placeholder="Ask CAD Copilot..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </aside>

    <!-- RIGHT SIDE: 3D CAD CANVAS -->
    <main id="canvas-container">
      <div id="log-output">Loading CAD Model...</div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    const chatHistory = [];

    function sendQuickAction(actionText) {
      document.getElementById('user-input').value = actionText;
      sendMessage();
    }

    function triggerReset() {
      if (typeof window.resetScene === 'function') {
        window.resetScene();
      }
      appendMessage('assistant', 'Scene and camera reset to default state.');
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const text = inputEl.value.trim();
      if (!text) return;

      const sendBtn = document.getElementById('send-btn');

      appendMessage('user', text);
      inputEl.value = '';
      sendBtn.disabled = true;

      const thinkingEl = appendMessage('assistant', 'Processing command...');

      try {
        const response = await fetch('http://localhost:8080/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: chatHistory })
        });

        const data = await response.json();

        if (data.error) {
          thinkingEl.innerText = `Error: ${data.error}`;
        } else {
          thinkingEl.innerText = data.reply;
          chatHistory.push({ role: 'user', content: text });
          chatHistory.push({ role: 'assistant', content: data.reply });
        }
      } catch (err) {
        thinkingEl.innerText = 'Error connecting to server. Ensure server.js is running.';
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const messagesContainer = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
